<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 互动波浪矩阵</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
        }
        
        canvas {
            display: block;
        }
        
        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 16px;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0, 150, 255, 0.8);
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="info">3D 互动波浪矩阵 - 点击立方体产生涟漪 | 拖拽旋转视角 | 滚轮缩放</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/lil-gui@0.18.2/dist/lil-gui.umd.js"></script>
    <script>
        window.addEventListener('load', function() {
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);
            
            const camera = new THREE.PerspectiveCamera(
                60,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(20, 25, 20);
            camera.lookAt(0, 0, 0);
            
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);
            
            let controls;
            try {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.minDistance = 10;
                controls.maxDistance = 60;
            } catch(e) {
                console.warn('OrbitControls not available:', e.message);
            }
            
            const config = {
                waveSpeed: 1.0,
                waveHeight: 2.0,
                wireframe: false
            };
            
            const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(20, 30, 20);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = 100;
            directionalLight.shadow.camera.left = -30;
            directionalLight.shadow.camera.right = 30;
            directionalLight.shadow.camera.top = 30;
            directionalLight.shadow.camera.bottom = -30;
            scene.add(directionalLight);
            
            const pointLight = new THREE.PointLight(0x00aaff, 0.8, 50);
            pointLight.position.set(0, 15, 0);
            scene.add(pointLight);
            
            const gridSize = 15;
            const cubeSize = 0.8;
            const spacing = 1.2;
            const cubes = [];
            
            const geometry = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
            
            for (let i = 0; i < gridSize; i++) {
                for (let j = 0; j < gridSize; j++) {
                    const material = new THREE.MeshStandardMaterial({
                        color: 0x0066ff,
                        metalness: 0.3,
                        roughness: 0.4,
                        emissive: 0x001133,
                        emissiveIntensity: 0.2,
                        wireframe: config.wireframe
                    });
                    
                    const cube = new THREE.Mesh(geometry, material);
                    
                    const x = (i - (gridSize - 1) / 2) * spacing;
                    const z = (j - (gridSize - 1) / 2) * spacing;
                    
                    cube.position.set(x, 0, z);
                    cube.castShadow = true;
                    cube.receiveShadow = true;
                    
                    cube.userData = {
                        gridX: i,
                        gridZ: j,
                        baseX: x,
                        baseZ: z,
                        originalScale: 1,
                        targetScale: 1,
                        isHovered: false
                    };
                    
                    cubes.push(cube);
                    scene.add(cube);
                }
            }
            
            let gui;
            try {
                const GUIConstructor = window.lil ? window.lil.GUI : window.GUI;
                if (GUIConstructor) {
                    gui = new GUIConstructor();
                    gui.add(config, 'waveSpeed', 0.1, 3.0).name('波浪速度');
                    gui.add(config, 'waveHeight', 0.5, 5.0).name('波浪高度');
                    gui.add(config, 'wireframe').name('线框模式').onChange((value) => {
                        cubes.forEach(cube => {
                            cube.material.wireframe = value;
                        });
                    });
                    console.log('GUI initialized successfully');
                } else {
                    console.warn('lil-gui not found in global scope');
                }
            } catch(e) {
                console.warn('GUI not available:', e.message);
            }
            
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            let hoveredCube = null;
            const ripples = [];
            
            function onClick(event) {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(cubes);
                
                if (intersects.length > 0) {
                    const cube = intersects[0].object;
                    ripples.push({
                        x: cube.userData.baseX,
                        z: cube.userData.baseZ,
                        startTime: Date.now() * 0.001,
                        maxRadius: 20,
                        speed: 8,
                        amplitude: 4
                    });
                }
            }
            
            function onMouseMove(event) {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            }
            
            window.addEventListener('mousemove', onMouseMove, false);
            window.addEventListener('click', onClick, false);
            
            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
            
            window.addEventListener('resize', onWindowResize, false);
            
            function animate() {
                requestAnimationFrame(animate);
                
                try {
                    const time = Date.now() * 0.001;
                    
                    if (controls) {
                        controls.update();
                    }
                    
                    for (let i = ripples.length - 1; i >= 0; i--) {
                        const ripple = ripples[i];
                        const elapsed = time - ripple.startTime;
                        const currentRadius = elapsed * ripple.speed;
                        if (currentRadius > ripple.maxRadius + 5) {
                            ripples.splice(i, 1);
                        }
                    }
                    
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(cubes);
                    
                    if (hoveredCube && (!intersects.length || intersects[0].object !== hoveredCube)) {
                        hoveredCube.userData.isHovered = false;
                        hoveredCube.userData.targetScale = 1;
                        hoveredCube.material.color.setHex(0x0066ff);
                        hoveredCube.material.emissive.setHex(0x001133);
                        hoveredCube.material.emissiveIntensity = 0.2;
                        hoveredCube = null;
                    }
                    
                    if (intersects.length > 0) {
                        const cube = intersects[0].object;
                        if (cube !== hoveredCube) {
                            hoveredCube = cube;
                            cube.userData.isHovered = true;
                            cube.userData.targetScale = 1.5;
                            cube.material.color.setHex(0xff3366);
                            cube.material.emissive.setHex(0xff0000);
                            cube.material.emissiveIntensity = 0.5;
                        }
                    }
                    
                    for (let i = 0; i < cubes.length; i++) {
                        const cube = cubes[i];
                        const { baseX, baseZ, isHovered, targetScale } = cube.userData;
                        
                        const distance = Math.sqrt(baseX * baseX + baseZ * baseZ);
                        
                        const waveHeight = Math.sin(distance * 0.5 - time * 2 * config.waveSpeed) * config.waveHeight;
                        const secondWave = Math.cos(baseX * 0.3 + time * 1.5 * config.waveSpeed) * Math.sin(baseZ * 0.3 + time * config.waveSpeed) * (config.waveHeight * 0.75);
                        
                        let targetY = waveHeight + secondWave;
                        
                        for (const ripple of ripples) {
                            const elapsed = time - ripple.startTime;
                            const currentRadius = elapsed * ripple.speed;
                            const dx = baseX - ripple.x;
                            const dz = baseZ - ripple.z;
                            const cubeDist = Math.sqrt(dx * dx + dz * dz);
                            const waveWidth = 3;
                            
                            if (cubeDist > currentRadius - waveWidth && cubeDist < currentRadius + waveWidth) {
                                const distFromWave = cubeDist - currentRadius;
                                const falloff = Math.max(0, 1 - (currentRadius / ripple.maxRadius));
                                const rippleEffect = Math.cos(distFromWave * 2) * ripple.amplitude * falloff * falloff;
                                targetY += rippleEffect;
                            }
                        }
                        
                        if (isHovered) {
                            targetY += 2;
                        }
                        
                        cube.position.y += (targetY - cube.position.y) * 0.1;
                        
                        const currentScale = cube.scale.x;
                        const newScale = currentScale + (targetScale - currentScale) * 0.15;
                        cube.scale.set(newScale, newScale, newScale);
                        
                        const hue = (Math.sin(time + distance * 0.1) * 0.5 + 0.5) * 0.1 + 0.55;
                        if (!isHovered) {
                            cube.material.color.setHSL(hue, 0.8, 0.5);
                            cube.material.emissive.setHSL(hue, 0.5, 0.1);
                        }
                    }
                    
                    pointLight.position.x = Math.sin(time * 0.5) * 10;
                    pointLight.position.z = Math.cos(time * 0.5) * 10;
                    
                    renderer.render(scene, camera);
                } catch(e) {
                    console.error('Render error:', e);
                }
            }
            
            animate();
        });
    </script>
</body>
</html>
