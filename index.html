<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 互动波浪矩阵</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
        }
        
        canvas {
            display: block;
        }
        
        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 16px;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0, 150, 255, 0.8);
            z-index: 100;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/",
            "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.17/+esm"
        }
    }
    </script>
</head>
<body>
    <div id="info">3D 互动波浪矩阵 - 移动鼠标交互 | 点击产生涟漪 | 拖拽旋转视角</div>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import GUI from 'lil-gui';
        
        const params = {
            waveSpeed: 1.0,
            waveHeight: 2.0,
            wireframe: false
        };
        
        const gui = new GUI();
        gui.domElement.style.marginTop = '60px';
        gui.add(params, 'waveSpeed', 0.1, 3.0, 0.1).name('波浪速度');
        gui.add(params, 'waveHeight', 0.5, 5.0, 0.1).name('波浪高度');
        gui.add(params, 'wireframe').name('线框模式').onChange((value) => {
            cubes.forEach(cube => {
                cube.material.wireframe = value;
            });
        });
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        
        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(20, 25, 20);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 10;
        controls.maxDistance = 60;
        controls.maxPolarAngle = Math.PI / 2.1;
        
        const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(20, 30, 20);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 100;
        directionalLight.shadow.camera.left = -30;
        directionalLight.shadow.camera.right = 30;
        directionalLight.shadow.camera.top = 30;
        directionalLight.shadow.camera.bottom = -30;
        scene.add(directionalLight);
        
        const pointLight = new THREE.PointLight(0x00aaff, 0.8, 50);
        pointLight.position.set(0, 15, 0);
        scene.add(pointLight);
        
        const gridSize = 15;
        const cubeSize = 0.8;
        const spacing = 1.2;
        const cubes = [];
        const originalPositions = [];
        const ripples = [];
        
        const geometry = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
        
        for (let i = 0; i < gridSize; i++) {
            for (let j = 0; j < gridSize; j++) {
                const material = new THREE.MeshStandardMaterial({
                    color: 0x0066ff,
                    metalness: 0.3,
                    roughness: 0.4,
                    emissive: 0x001133,
                    emissiveIntensity: 0.2
                });
                
                const cube = new THREE.Mesh(geometry, material);
                
                const x = (i - (gridSize - 1) / 2) * spacing;
                const z = (j - (gridSize - 1) / 2) * spacing;
                
                cube.position.set(x, 0, z);
                cube.castShadow = true;
                cube.receiveShadow = true;
                
                cube.userData = {
                    gridX: i,
                    gridZ: j,
                    baseX: x,
                    baseZ: z,
                    originalScale: 1,
                    targetScale: 1,
                    isHovered: false
                };
                
                cubes.push(cube);
                originalPositions.push({ x, z });
                scene.add(cube);
            }
        }
        
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let hoveredCube = null;
        
        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        }
        
        function onClick(event) {
            if (event.button !== 0) return;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cubes);
            
            if (intersects.length > 0) {
                const clickedCube = intersects[0].object;
                const { baseX, baseZ } = clickedCube.userData;
                
                const ripple = {
                    centerX: baseX,
                    centerZ: baseZ,
                    startTime: Date.now(),
                    maxRadius: gridSize * spacing * 0.8,
                    duration: 3000,
                    amplitude: 4.0,
                    speed: 8.0
                };
                
                ripples.push(ripple);
                
                if (ripples.length > 10) {
                    ripples.shift();
                }
            }
        }
        
        window.addEventListener('mousemove', onMouseMove, false);
        window.addEventListener('click', onClick, false);
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        window.addEventListener('resize', onWindowResize, false);
        
        function calculateRippleOffset(baseX, baseZ, currentTime) {
            let totalOffset = 0;
            
            for (let i = ripples.length - 1; i >= 0; i--) {
                const ripple = ripples[i];
                const elapsed = currentTime - ripple.startTime;
                
                if (elapsed > ripple.duration) {
                    ripples.splice(i, 1);
                    continue;
                }
                
                const dx = baseX - ripple.centerX;
                const dz = baseZ - ripple.centerZ;
                const distance = Math.sqrt(dx * dx + dz * dz);
                
                const currentRadius = (elapsed / 1000) * ripple.speed;
                const waveWidth = 3.0;
                
                const distanceFromWave = Math.abs(distance - currentRadius);
                
                if (distanceFromWave < waveWidth) {
                    const progress = elapsed / ripple.duration;
                    const decay = Math.exp(-progress * 3) * (1 - progress);
                    
                    const wavePhase = (distance - currentRadius) * 2;
                    const waveIntensity = Math.cos(wavePhase) * Math.exp(-distanceFromWave * 0.5);
                    
                    const amplitude = ripple.amplitude * decay * waveIntensity;
                    totalOffset += amplitude;
                }
            }
            
            return totalOffset;
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            const time = Date.now() * 0.001;
            const currentTime = Date.now();
            
            controls.update();
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cubes);
            
            if (hoveredCube && (!intersects.length || intersects[0].object !== hoveredCube)) {
                hoveredCube.userData.isHovered = false;
                hoveredCube.userData.targetScale = 1;
                hoveredCube.material.color.setHex(0x0066ff);
                hoveredCube.material.emissive.setHex(0x001133);
                hoveredCube.material.emissiveIntensity = 0.2;
                hoveredCube = null;
            }
            
            if (intersects.length > 0) {
                const cube = intersects[0].object;
                if (cube !== hoveredCube) {
                    hoveredCube = cube;
                    cube.userData.isHovered = true;
                    cube.userData.targetScale = 1.5;
                    cube.material.color.setHex(0xff3366);
                    cube.material.emissive.setHex(0xff0000);
                    cube.material.emissiveIntensity = 0.5;
                }
            }
            
            for (let i = 0; i < cubes.length; i++) {
                const cube = cubes[i];
                const { baseX, baseZ, isHovered, targetScale } = cube.userData;
                
                const distance = Math.sqrt(baseX * baseX + baseZ * baseZ);
                
                const waveHeight = Math.sin(distance * 0.5 - time * 2 * params.waveSpeed) * params.waveHeight;
                const secondWave = Math.cos(baseX * 0.3 + time * 1.5 * params.waveSpeed) * 
                                   Math.sin(baseZ * 0.3 + time * params.waveSpeed) * 1.5 * (params.waveHeight / 2);
                
                let targetY = waveHeight + secondWave;
                
                const rippleOffset = calculateRippleOffset(baseX, baseZ, currentTime);
                targetY += rippleOffset;
                
                if (isHovered) {
                    targetY += 2;
                }
                
                cube.position.y += (targetY - cube.position.y) * 0.1;
                
                const currentScale = cube.scale.x;
                const newScale = currentScale + (targetScale - currentScale) * 0.15;
                cube.scale.set(newScale, newScale, newScale);
                
                const hue = (Math.sin(time + distance * 0.1) * 0.5 + 0.5) * 0.1 + 0.55;
                if (!isHovered) {
                    cube.material.color.setHSL(hue, 0.8, 0.5);
                    cube.material.emissive.setHSL(hue, 0.5, 0.1);
                }
            }
            
            pointLight.position.x = Math.sin(time * 0.5) * 10;
            pointLight.position.z = Math.cos(time * 0.5) * 10;
            
            renderer.render(scene, camera);
        }
        
        animate();
    </script>
</body>
</html>
